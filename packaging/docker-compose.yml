# WATERCAST 설치 패키지용 compose — 빌드하지 않는다.
#   이미지  = images/ 에서 load 한 런타임 이미지(python + 의존성 + docker CLI, 앱 코드 없음)
#   앱 코드 = app/current (install.sh·update_app.sh 가 app/watercast-app-*.tar.gz 를 풀어 둔 곳) → 컨테이너 /app 에 마운트
#   코드만 바뀌면 이미지는 그대로 두고 ./update_app.sh <새 묶음> 으로 교체한다. 의존성(requirements)이 바뀌면 런타임 이미지도 교체.
# 포트·이미지 태그·연계 값은 같은 디렉터리의 .env 에서 읽는다 (.env.example 참고).
services:
  watercast:
    image: ${WATERCAST_IMAGE:-watercast-runtime:0.2.0}
    container_name: ${WATERCAST_NAME:-watercast}
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["./docker/entrypoint.sh"]
    ports:
      - "${WATERCAST_API_PORT:-18000}:8000"
      - "${WATERCAST_UI_PORT:-8501}:8501"
    environment:
      - KMA_API_KEY=${KMA_API_KEY:-}
      # /app/data 는 읽기전용. 잡 상태·규약 산출물·융합 작업공간·사용자 지역은 쓰기 가능한 backend/data 아래.
      - BACKEND_WBMS_JOBS_DIR=/app/backend/data/wbms_jobs
      - BACKEND_WBMS_FUSION_DIR=/app/backend/data/wbms_fusion
      - BACKEND_WBMS_PRODUCT_DIR=/app/backend/data/wbms_products
      - REGIONS_USER_DIR=/app/backend/data/regions
      - GAUGE_FORECASTER_PLUGINS=backend.app.gauge.plugins.neural:NeuralMLP,backend.app.gauge.plugins.neural:NeuralLSTM,backend.app.gauge.plugins.neural:NeuralGRU,backend.app.gauge.plugins.neural:NeuralTCN,backend.app.gauge.plugins.prophet_hybrid:ProphetHybrid
      # 과제 통합 플랫폼 연계 — 통합 측이 배정한 값을 .env 에 넣는다. URL 이 비면 로그를 보내지 않는다.
      - BACKEND_LIAISON_LOG_URL=${BACKEND_LIAISON_LOG_URL:-}
      - BACKEND_LIAISON_SYSTEM_CODE=${BACKEND_LIAISON_SYSTEM_CODE:-SC000000}
      - BACKEND_LIAISON_ALGM_ID=${BACKEND_LIAISON_ALGM_ID:-AG000000}
      # ── 컨테이너 안에서 탐지 실행 (docker 소켓, README 6절) ──
      # docker run 은 호스트 데몬이 수행하므로 -v 경로를 /app → 호스트 경로로 바꾼다.
      # HOST_ROOT 는 이 패키지 디렉터리의 호스트 절대경로(비우면 compose 를 실행한 디렉터리).
      - BACKEND_HOST_ROOT=${HOST_ROOT:-${PWD}}
      - BACKEND_CONTAINER_ROOT=/app
      # 탐지 컨테이너를 돌릴 uid:gid — 산출물 소유자. data/wbms_runs 소유자와 같아야 한다.
      - BACKEND_RUN_AS=${RUN_AS:-1000:1000}
      # cpu | gpu | auto — auto 는 여유 VRAM 3000 MiB 이상이면 GPU, 아니면 CPU 폴백.
      - BACKEND_WBMS_GPU=${WBMS_GPU:-auto}
    volumes:
      # 앱 코드(묶음을 풀어 둔 디렉터리) — 교체는 ./update_app.sh
      - ./app/current:/app
      - ./backend/data:/app/backend/data
      - ./data:/app/data:ro
      # 탐지 마스크 캐시만 쓰기 가능(중첩 바인드가 상위 :ro 를 덮는다)
      - ./data/wbms_runs:/app/data/wbms_runs
      # 호스트 docker 데몬 — 컨테이너에 호스트 docker 권한을 준다(README 6절)
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'ok' in urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 발표용 파이프라인 데모 화면. 같은 이미지, 진입점만 다르다. 필요 없으면 .env 의 COMPOSE_PROFILES 를 비운다.
  pipeline-ui:
    image: ${WATERCAST_IMAGE:-watercast-runtime:0.2.0}
    container_name: ${WATERCAST_NAME:-watercast}-pipeline
    profiles: ["demo"]
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["./docker/pipeline_entrypoint.sh"]
    ports:
      - "${WATERCAST_PIPE_PORT:-8502}:8501"
    volumes:
      - ./app/current:/app
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
